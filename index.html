<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Vanilla JS Image Slider</h1>

    <div class="slider" id="mySlider">
      <div class="slider__viewport">
        <div class="slider__track">
          <div class="slider__slide"><img src="images/photo1.jpeg" alt="Patan"></div>
          <div class="slider__slide"><img src="images/photo2.jpeg" alt="Patan"></div>
          <div class="slider__slide"><img src="images/photo3.jpeg" alt="Muktinath"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="slider.js"></script>
</body>
</html>
